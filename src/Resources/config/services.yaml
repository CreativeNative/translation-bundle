services:
    # ----------------------------
    # Default service configuration
    # ----------------------------
    # Nothing here is public. Consumers autowire against an interface or class
    # (EntityTranslatorInterface, LocaleVariantFinder, ...); commands, the Twig
    # extension, the cache warmer and every listener/subscriber reach the
    # container through their tag, never through container->get(). This
    # default also governs every alias declared below it (an alias with no
    # explicit `public:` inherits _defaults.public), so
    # tmi_translation.translation.entity_translator and its siblings are
    # private too.
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # ----------------------------
    # Utility Services
    # ----------------------------
    tmi_translation.utils.attribute_helper:
        class: Tmi\TranslationBundle\Utils\AttributeHelper

    # ----------------------------
    # Cache Service
    # ----------------------------
    # Symfony does not autoconfigure ResetInterface into the kernel.reset tag --
    # it is added explicitly here so a long-running worker resets this cache
    # between requests instead of handing a later one an entity the earlier
    # one cached (and possibly, since, detached).
    Tmi\TranslationBundle\Translation\Cache\InMemoryTranslationCache:
        tags: [ { name: kernel.reset, method: reset } ]

    Tmi\TranslationBundle\Translation\Cache\TranslationCacheInterface:
        alias: Tmi\TranslationBundle\Translation\Cache\InMemoryTranslationCache

    # ----------------------------
    # Type Default Resolver
    # ----------------------------
    Tmi\TranslationBundle\Translation\TypeDefaultResolver: ~

    # ----------------------------
    # Compile-Time Validation
    # ----------------------------
    Tmi\TranslationBundle\CacheWarmer\TranslatableEntityValidationWarmer:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
        tags:
            - { name: kernel.cache_warmer, priority: -100 }

    # ----------------------------
    # Entity Translator
    # ----------------------------
    # Symfony does not autoconfigure ResetInterface into the kernel.reset tag -- it
    # is added explicitly here, same as InMemoryTranslationCache above, so a
    # long-running worker forgets a batch's preload() miss memory between units of
    # work instead of treating a variant another unit of work (or process) created
    # since as still absent. See EntityTranslator::preload()'s docblock.
    Tmi\TranslationBundle\Translation\EntityTranslator:
        arguments:
            $defaultLocale: '%tmi_translation.default_locale%'
            $locales: '%kernel.enabled_locales%'
            $copySource: '%tmi_translation.copy_source%'
            $eventDispatcher: '@event_dispatcher'
            $attributeHelper: '@tmi_translation.utils.attribute_helper'
            $typeDefaultResolver: '@Tmi\TranslationBundle\Translation\TypeDefaultResolver'
            $cache: '@Tmi\TranslationBundle\Translation\Cache\TranslationCacheInterface'
            $finder: '@Tmi\TranslationBundle\Doctrine\LocaleVariantFinder'
            $logger: '@?logger'
        tags: [ { name: kernel.reset, method: reset } ]

    tmi_translation.translation.entity_translator:
        alias: Tmi\TranslationBundle\Translation\EntityTranslator

    # ----------------------------
    # Locale Variant Lookups / Removal
    # ----------------------------
    Tmi\TranslationBundle\Doctrine\LocaleVariantFinder:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'

    Tmi\TranslationBundle\Doctrine\TranslatableRemover:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $finder: '@Tmi\TranslationBundle\Doctrine\LocaleVariantFinder'

    tmi_translation.doctrine.translatable_remover:
        alias: Tmi\TranslationBundle\Doctrine\TranslatableRemover

    # ----------------------------
    # Per-Locale Completeness
    # ----------------------------
    Tmi\TranslationBundle\Translation\LocaleCompletenessResolver:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $attributeHelper: '@tmi_translation.utils.attribute_helper'
            $defaultLocale: '%tmi_translation.default_locale%'
            $locales: '%kernel.enabled_locales%'
            $finder: '@Tmi\TranslationBundle\Doctrine\LocaleVariantFinder'

    tmi_translation.translation.locale_completeness_resolver:
        alias: Tmi\TranslationBundle\Translation\LocaleCompletenessResolver

    # ----------------------------
    # Translation Handlers
    # ----------------------------
    Tmi\TranslationBundle\Translation\Handlers\PrimaryKeyHandler:
        arguments:
            - '@tmi_translation.utils.attribute_helper'
        tags: [ { name: tmi_translation.translation_handler, priority: 100 } ]

    Tmi\TranslationBundle\Translation\Handlers\ScalarHandler:
        tags: [ { name: tmi_translation.translation_handler, priority: 90 } ]

    Tmi\TranslationBundle\Translation\Handlers\EmbeddedHandler:
        arguments:
            - '@tmi_translation.utils.attribute_helper'
            - '@Tmi\TranslationBundle\Translation\TypeDefaultResolver'
        tags: [ { name: tmi_translation.translation_handler, priority: 80 } ]

    Tmi\TranslationBundle\Translation\Handlers\BidirectionalManyToOneHandler:
        arguments:
            - '@tmi_translation.utils.attribute_helper'
            - '@doctrine.orm.entity_manager'
            - '@property_accessor'
            - '@Tmi\TranslationBundle\Translation\Handlers\TranslatableEntityHandler'
        tags: [ { name: tmi_translation.translation_handler, priority: 70 } ]

    Tmi\TranslationBundle\Translation\Handlers\BidirectionalOneToManyHandler:
        arguments:
            - '@tmi_translation.utils.attribute_helper'
            - '@Tmi\TranslationBundle\Translation\EntityTranslator'
            - '@doctrine.orm.entity_manager'
        tags: [ { name: tmi_translation.translation_handler, priority: 60 } ]

    Tmi\TranslationBundle\Translation\Handlers\BidirectionalOneToOneHandler:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@property_accessor'
            - '@tmi_translation.utils.attribute_helper'
            - '@Tmi\TranslationBundle\Translation\Handlers\TranslatableEntityHandler'
        tags: [ { name: tmi_translation.translation_handler, priority: 50 } ]

    Tmi\TranslationBundle\Translation\Handlers\BidirectionalManyToManyHandler:
        arguments:
            - '@tmi_translation.utils.attribute_helper'
            - '@doctrine.orm.entity_manager'
            - '@Tmi\TranslationBundle\Translation\EntityTranslator'
        tags: [ { name: tmi_translation.translation_handler, priority: 40 } ]

    Tmi\TranslationBundle\Translation\Handlers\UnidirectionalManyToManyHandler:
        arguments:
            - '@tmi_translation.utils.attribute_helper'
            - '@Tmi\TranslationBundle\Translation\EntityTranslator'
            - '@doctrine.orm.entity_manager'
        tags: [ { name: tmi_translation.translation_handler, priority: 30 } ]

    Tmi\TranslationBundle\Translation\Handlers\TranslatableEntityHandler:
        arguments:
            - '@Tmi\TranslationBundle\Translation\Handlers\DoctrineObjectHandler'
            - '@tmi_translation.utils.attribute_helper'
        tags: [ { name: tmi_translation.translation_handler, priority: 20 } ]

    Tmi\TranslationBundle\Translation\Handlers\DoctrineObjectHandler:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@Tmi\TranslationBundle\Translation\EntityTranslator'
            - '@?property_accessor'
        tags: [ { name: tmi_translation.translation_handler, priority: 10 } ]

    # ----------------------------
    # Twig Extension
    # ----------------------------
    Tmi\TranslationBundle\Twig\TmiTranslationExtension:
        arguments:
            - '%kernel.enabled_locales%'
        tags: [ { name: twig.extension } ]

    # ----------------------------
    # Kernel Event Subscriber
    # ----------------------------
    Tmi\TranslationBundle\EventSubscriber\LocaleFilterConfigurator:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $disabledFirewalls: '%tmi_translation.disabled_firewalls%'
            $firewallMap: '@?security.firewall.map'
            $requestStack: '@request_stack'
        tags: [ { name: kernel.event_subscriber } ]

    # ----------------------------
    # Doctrine Event Subscriber
    # ----------------------------
    Tmi\TranslationBundle\Doctrine\EventSubscriber\TranslatableEventSubscriber:
        arguments:
            $defaultLocale: '%tmi_translation.default_locale%'
            $logger: '@?logger'
            $strictOrphanCheck: '%tmi_translation.strict_orphan_check%'
        tags: [ { name: doctrine.event_subscriber, connection: default } ]

    # ----------------------------
    # Doctrine Metadata Listener — composite (tuuid, locale) index
    # ----------------------------
    Tmi\TranslationBundle\Doctrine\EventListener\TranslatableIndexListener:
        arguments:
            $unique: '%tmi_translation.unique_locale_variants%'
        tags: [ { name: doctrine.event_listener, event: loadClassMetadata } ]

    # ----------------------------
    # Doctrine Listener — opt-in cascade removal of locale variants
    # ----------------------------
    Tmi\TranslationBundle\Doctrine\EventListener\LocaleVariantRemovalListener:
        arguments:
            $remover: '@Tmi\TranslationBundle\Doctrine\TranslatableRemover'
            $enabled: '%tmi_translation.cascade_remove_locale_variants%'
        tags: [ { name: doctrine.event_listener, event: preRemove } ]

    # ----------------------------
    # Diagnostic / Maintenance Commands
    # ----------------------------
    Tmi\TranslationBundle\Doctrine\TranslatableEntityLocator:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'

    Tmi\TranslationBundle\Command\TranslationDoctorCommand:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $locator: '@Tmi\TranslationBundle\Doctrine\TranslatableEntityLocator'
            $locales: '%kernel.enabled_locales%'
        tags: [ { name: console.command } ]

    Tmi\TranslationBundle\Command\SyncSharedTranslationsCommand:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $locator: '@Tmi\TranslationBundle\Doctrine\TranslatableEntityLocator'
            $attributeHelper: '@tmi_translation.utils.attribute_helper'
            $defaultLocale: '%tmi_translation.default_locale%'
        tags: [ { name: console.command } ]
